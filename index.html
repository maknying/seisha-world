<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spirit to the Journey</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
    }

    .hero {
      min-height: 100vh;
      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.85)),
        url("seisha-bg.png");
      background-size: cover;
      background-position: center;
      position: relative;
      padding: 28px;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      font-size: 16px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      opacity: 0.75;
    }

    .nav-links a.active {
      opacity: 1;
      border-bottom: 2px solid white;
      padding-bottom: 6px;
    }

    .menu {
      font-size: 30px;
      line-height: 1;
    }

    .content {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 100px;
      z-index: 2;
    }

    .content h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      letter-spacing: 5px;
      font-weight: 400;
      margin-bottom: 16px;
    }

    .content p {
      font-size: 20px;
      line-height: 1.6;
      color: #cfcfcf;
      margin-bottom: 28px;
      max-width: 360px;
    }

    .divider {
      width: 250px;
      height: 1px;
      background: rgba(255,255,255,0.35);
      margin-bottom: 28px;
      position: relative;
    }

    .divider::after {
      content: "◇";
      position: absolute;
      left: 50%;
      top: -10px;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      background: transparent;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 16px 34px;
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 999px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      backdrop-filter: blur(6px);
      background: rgba(0,0,0,0.25);
    }

    .button span {
      font-size: 28px;
    }

    @media (max-width: 600px) {
      .hero {
        padding: 24px;
        background-position: center top;
      }

      .nav-links {
        gap: 18px;
        font-size: 15px;
      }

      .logo {
        font-size: 14px;
      }

      .content h1 {
        font-size: 46px;
      }

      .content p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <nav class="navbar">
      <div class="logo">Spirit to the Journey</div>

      <div class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Profil</a>
      </div>

      <div class="menu">☰</div>
    </nav>

    <div class="content">
      <h1>SEISHA</h1>
      <p>Di antara takdir dan pilihan, ia berjalan sendirian.</p>

      <div class="divider"></div>

      <a href="#" class="button">
        Mulai Membaca <span>›</span>
      </a>
    </div>
  </section>
</body>
</html>
